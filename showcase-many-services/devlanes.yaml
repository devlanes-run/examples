# yaml-language-server: $schema=https://devlanes.run/v1/schema.json
# Generated by generate.mjs (40 services). Edit generate.mjs or run
# `node generate.mjs <count>` instead of editing this file.
project: many-services

global_env:
  LANE_LABEL: ${{ lane.label }}
  LANE_DOMAIN: ${{ lane.domain }}

# A service takes the colour of its first tag that has one, so the TUI and the
# monitor show each category in its own colour.
tags:
  api: { color: cyan, description: JSON APIs }
  web: { color: green, description: Pages }
  worker: { color: magenta, description: Workers that handle a batch every few seconds }
  job: { color: yellow, description: Jobs that run a longer task now and then }

# Every service runs server.mjs. BOOT_MS is how long it works before it
# listens, BURST_MS how long each CPU burst lasts and BURST_EVERY_MS the pause
# between bursts; each is a min-max range in milliseconds, picked at random.
templates:
  node:
    # node itself rather than an npm script: npm would add a second Node
    # process to each of the 40 services.
    run: [node, server.mjs]
    cwd: .
    env:
      BOOT_MS: 1000-6000
  api:
    extends: node
    tags: [api]
    # Each service holds its start slot until its ready check passes.
    ready:
      http:
        path: /healthz
    env:
      KIND: api
      BURST_MS: 30-120
      BURST_EVERY_MS: 2000-5000
  web:
    extends: node
    tags: [web]
    ready:
      http:
        path: /healthz
    env:
      KIND: web
      BURST_MS: 20-80
      BURST_EVERY_MS: 3000-6000
  worker:
    extends: node
    tags: [worker]
    # No page to probe: the start waits for this line instead.
    ready:
      log: "ready after"
    env:
      KIND: worker
      BURST_MS: 100-300
      BURST_EVERY_MS: 4000-8000
  job:
    extends: node
    tags: [job]
    ready:
      log: "ready after"
    env:
      KIND: job
      BURST_MS: 300-800
      BURST_EVERY_MS: 10000-20000

services:
  index:
    extends: web
    hosts: "${{ lane.domain }}"
    env:
      PAGE: index
      # The index asks every service for /stats on each page load.
      SERVICES: index,api-01,web-01,worker-01,job-01,api-02,web-02,worker-02,job-02,api-03,web-03,worker-03,job-03,api-04,web-04,worker-04,job-04,api-05,web-05,worker-05,job-05,api-06,web-06,worker-06,job-06,api-07,web-07,worker-07,job-07,api-08,web-08,worker-08,job-08,api-09,web-09,worker-09,job-09,api-10,web-10,worker-10
      URL_INDEX: ${{ services.index.url }}
      URL_API_01: ${{ services.api_01.url }}
      URL_WEB_01: ${{ services.web_01.url }}
      URL_WORKER_01: ${{ services.worker_01.url }}
      URL_JOB_01: ${{ services.job_01.url }}
      URL_API_02: ${{ services.api_02.url }}
