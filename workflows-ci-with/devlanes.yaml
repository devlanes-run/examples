# yaml-language-server: $schema=https://devlanes.run/v1/schema.json
project: ci-with

global_env:
  LANE_LABEL: ${{ lane.label }}
  LANE_DOMAIN: ${{ lane.domain }}

services:
  api:
    run_script:
      file: api/package.json
      name: dev
    # Tests read this as DEVLANES_PUBLIC_URL_API, so they never hardcode the
    # lane's domain: api.ci-with.localhost in lane 0, api.ci-with1.localhost in lane 1.
    hosts: api.${{ lane.domain }}
    ready:
      http:
        path: /healthz

  web:
    run_script:
      file: web/package.json
      name: dev
    hosts: ${{ lane.domain }}
    ready:
      http:
        path: /healthz
    env:
      API_URL: ${{ services.api.public_url }}

profiles:
  # For `devlanes with --profile e2e` and the GitHub Action's `profile: e2e`:
  # every service runs its `start` script instead of `dev`, without --watch.
  e2e:
    include: ["*"]
    run_scripts:
      dev: start
    env:
      NODE_ENV: test
