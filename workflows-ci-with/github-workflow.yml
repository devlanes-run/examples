# Copy to .github/workflows/ to run this example's tests in GitHub Actions.
# The examples repository's own CI does not run it.
name: ci-with

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # upload-logs: on-failure (the default) asks the GitHub API which steps failed.
  actions: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Same as `devlanes with --profile e2e -- npm test` on your machine. The
      # action uploads the unit logs as an artifact when the step fails.
      - uses: devlanes-run/action@v0
        with:
          command: with
          # The folder with devlanes.yaml, relative to the repository root.
          # Use `.` (the default) when devlanes.yaml sits at the root.
          working-directory: workflows-ci-with
          profile: e2e
          run: npm test
          # The release this example was tested with. Without it the action
          # installs 0.11.0, since no lockfile here names devlanes.
          version: 0.11.3
