# Reference only. A copy of mprocs.yaml with autostart: false on what most
# people did not need, run with `scripts/slot.sh essentials`. Every change to
# mprocs.yaml had to be made here too.
procs:
  docker-up:
    cmd: [docker, compose, up, -d]
    cwd: <CONFIG_DIR>
  docker-down:
    cmd: [docker, compose, down]
    cwd: <CONFIG_DIR>
    autostart: false

  migrate:
    shell: npm run migrate
    cwd: <CONFIG_DIR>/..
    autostart: false
  seed:
    shell: npm run seed
    cwd: <CONFIG_DIR>/..
    autostart: false

  api:
    shell: npm run api
    cwd: <CONFIG_DIR>/..
    autorestart: true
  web:
    shell: PORT=${WEB_PORT:-3000} API_URL=${API_PUBLIC_URL:-https://api.acme.localhost} npm run web
    cwd: <CONFIG_DIR>/..
    env:
      NODE_OPTIONS: --use-system-ca
  worker:
    shell: npm run worker
    cwd: <CONFIG_DIR>/..
    autorestart: true
    deps: [api]
  sms-stub:
    shell: PORT=4010 npm run sms-stub
    cwd: <CONFIG_DIR>/..
    autostart: false

  btop:
    cmd: [btop]
    autostart: false
