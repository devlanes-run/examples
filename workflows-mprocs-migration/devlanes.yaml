# yaml-language-server: $schema=https://devlanes.run/v1/schema.json
# The stack from before/mprocs.yaml. Comments name the mprocs, Caddy or slot.sh
# piece each key replaces. before/scripts/slot.sh has no replacement line: every
# worktree is a lane with its own ports, hostnames and data folder.
project: example-mprocs-migration

global_env:
  LANE_LABEL: ${{ lane.label }}
  LANE_DOMAIN: ${{ lane.domain }}
  # slot.sh exported API_URL with the slot's api port.
  API_URL: ${{ services.api.url }}
  # Was .data/acme.json in the worktree. Lanes started with `devlanes lane new`
  # share the folder, so the file moves to the lane's data folder.
  DATA_FILE: ${{ lane.data_path }}/acme.json
  # NODE_OPTIONS=--use-system-ca is gone: devlanes sets NODE_EXTRA_CA_CERTS on
  # Node units, and web calls the api over http now.

tasks:
  # A new worktree has no node_modules; one install at the root covers every app.
  # Under mprocs each person ran it by hand after a checkout.
  install:
    run: [npm, install]
    when: lane.create
  # The migrate pane (autostart: false) people forgot to run after a pull.
  migrate:
    run_script:
      file: apps/api/package.json
      name: db:migrate
    when: lane.start
  # The seed pane. It posts through the api, so it waits for the services, and
  # runs once per lane; `devlanes run seed` queues more.
  seed:
    run_script:
      file: apps/api/package.json
      name: db:seed
    when: lane.create
    after: services
  # docker-up and docker-down only ran Caddy, which `hosts` replaces. btop is
  # `devlanes debug top`.

services:
  api:
    run_script:
      file: apps/api/package.json
      name: dev
    env:
      # The app reads API_PORT, not PORT, so it gets the lane's port under its
      # own name. Its default, 4000, is what mprocs used.
      API_PORT: ${{ self.port }}
    # Caddyfile: api.acme.localhost -> :4000
    hosts: api.${{ lane.domain }}
    ready:
      http:
        path: /healthz
    tags: [api, essential]

  web:
    # Reads PORT, which devlanes sets; the mprocs pane ran PORT=$WEB_PORT.
    run_script:
      file: apps/web/package.json
      name: dev
    env:
      API_PUBLIC_URL: ${{ services.api.public_url }}
      SMS_PUBLIC_URL: ${{ services.sms_stub.public_url }}
    # Caddyfile: acme.localhost -> :3000
    hosts: ${{ lane.domain }}
    ready:
      http:
        path: /healthz
    tags: [web, essential]

  worker:
    run_script:
      file: apps/worker/package.json
      name: dev
    env:
      SMS_URL: ${{ services.sms_stub.url }}
    # No port. The worker prints this once the api has answered, which covers
    # what `deps: [api]` did under mprocs.
    ready:
      log: "worker ready"
    # It polls without inbound requests, so an idle lane must not freeze it.
    keep_awake: true
    tags: [worker, essential]

  sms-stub:
    run_script:
      file: apps/sms-stub/package.json
      name: dev
    env:
      # Clients outside this repository post to 127.0.0.1:4010, so the stub
      # keeps its literal port. It is the same in every lane, so one lane at a
      # time can run it, and every lane's SMS_URL points at that one.
      PORT: 4010
    # Caddyfile: sms.acme.localhost -> :4010
    hosts: sms.${{ lane.domain }}
    ready:
      http:
        path: /healthz
    tags: [stub]

profiles:
  # mprocs.essentials.yaml, the copy of mprocs.yaml with autostart: false on
  # everything else.
  default: [+essential]
  # Needed a third copy of the file under mprocs.
  backend: [+api, +worker, +stub]
