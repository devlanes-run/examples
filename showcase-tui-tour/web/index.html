<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tui-tour</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;900&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  .send { display: flex; gap: 8px; max-width: 680px; margin: 0 auto 24px; }
  .send input { flex: 1; padding: 8px 12px; border: 1px solid var(--dl-ink); border-radius: 5px; font: 16px var(--dl-sans); background: #fff8dc; }
</style>
</head>
<body>
<div class="dl-page">
  <header class="dl-header">
    <a class="dl-brand" href="/"><img src="/logo.svg" alt="" width="32" height="32">devlanes</a>
    <nav class="dl-nav"><a href="https://github.com/devlanes-run/examples/tree/main/showcase-tui-tour">showcase-tui-tour on GitHub</a></nav>
  </header>
  <main class="dl-main">
    <h1 class="dl-title" id="title">This is a lane of tui-tour.</h1>
    <p class="dl-lede" id="lede"></p>
    <div class="dl-card">
      <div class="dl-bar"><span class="dl-dots"><i></i><i></i><i></i></span><span>web</span><span></span></div>
      <dl class="dl-rows" id="lane"></dl>
    </div>

    <h2 class="dl-h2">Orders from api</h2>
    <div class="dl-card">
      <div class="dl-bar"><span class="dl-dots"><i></i><i></i><i></i></span><span id="orders-title">GET /api/orders</span><span></span></div>
      <dl class="dl-rows" id="orders"><dt>...</dt><dd></dd></dl>
    </div>

    <h2 class="dl-h2">Send a mail</h2>
    <p class="dl-lede">api puts the mail on this lane's Redis queue, the worker sends it over SMTP, and it lands in the lane's own Mailpit at <a id="inbox"></a>.</p>
    <form class="send" id="send">
      <input name="to" type="email" required value="dev@example.invalid">
      <button class="dl-button" type="submit">Send</button>
    </form>
    <div class="dl-card">
      <div class="dl-bar"><span class="dl-dots"><i></i><i></i><i></i></span><span id="mail-title">GET /api/mail</span><span></span></div>
      <dl class="dl-rows" id="mail"><dt>...</dt><dd></dd></dl>
    </div>
  </main>
  <footer class="dl-footer" id="footer"></footer>
</div>
<script type="module" src="/main.js"></script>
</body>
</html>
