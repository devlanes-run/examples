services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["127.0.0.1::5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  redis:
    image: redis:8.10.3-alpine
    ports: ["127.0.0.1::6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # Listed in infra.per_lane, so every lane runs its own copy and inbox. The web
  # UI port comes first, so infra.hosts routes mail.<lane domain> to it.
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports: ["127.0.0.1::8025", "127.0.0.1::1025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
  redisdata:
