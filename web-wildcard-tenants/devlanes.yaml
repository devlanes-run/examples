# yaml-language-server: $schema=https://devlanes.run/v1/schema.json
project: example-wildcard-tenants

lanes:
  vars:
    # Tenant pages get a site of their own: example-wildcard-sites.localhost in lane 0,
    # example-wildcard-sites1.localhost in lane 1. The app's cookie for the lane domain never
    # reaches them. The name ends in a letter so lane 1 never meets lane 0 of another name.
    sites_domain: ${{ domain('example-wildcard-sites') }}

global_env:
  LANE_LABEL: ${{ lane.label }}
  LANE_DOMAIN: ${{ lane.domain }}
  SITES_DOMAIN: ${{ lane.sites_domain }}

tasks:
  # A new worktree has no node_modules. One install at the root covers every workspace.
  install:
    run: [npm, install]
    when: lane.create

services:
  app:
    run_script: { file: apps/app/package.json, name: dev }
    hosts: app.${{ lane.domain }}
    ready:
      http: { path: /healthz }

  sites:
    run_script: { file: apps/sites/package.json, name: dev }
    # Quoted: an unquoted leading * is a YAML alias.
    hosts: "*.${{ lane.sites_domain }}"
    ready:
      http: { path: /healthz }

  gateway:
    run_script: { file: apps/gateway/package.json, name: dev }
    hosts:
      # Catches every subdomain of the lane that no other route claims, exact or wildcard.
      - host: "*.${{ lane.domain }}"
        fallback: true
    ready:
      http: { path: /healthz }

  links:
    run_script: { file: apps/links/package.json, name: dev }
    # An exact hostname, so it wins over the gateway's wildcard.
    hosts: go.${{ lane.domain }}
    ready:
      http: { path: /healthz }
