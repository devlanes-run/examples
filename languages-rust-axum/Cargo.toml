[workspace]
# devlanes.yaml points run_script at this file; devlanes finds the member that owns each
# binary and runs `cargo run -p <member> --bin <name>`.
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"

[workspace.dependencies]
shared = { path = "crates/shared" }
askama = "=0.16.1"
axum = "=0.8.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net"] }
# Native roots load SSL_CERT_FILE, which devlanes points at its CA bundle. reqwest 0.13
# dropped this feature; its default verifier asks the Windows and macOS stores and
# ignores SSL_CERT_FILE there.
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
