[package]
name = "rust-axum"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"

# Binaries come from src/bin/web.rs and src/bin/api.rs; devlanes.yaml runs each one
# with run_script, which becomes `cargo run --bin <name>`.

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net"] }
serde_json = "=1.0.154"
# Native roots load SSL_CERT_FILE, which devlanes points at its CA bundle. reqwest 0.13
# dropped this feature; its default verifier asks the Windows and macOS stores and
# ignores SSL_CERT_FILE there.
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
