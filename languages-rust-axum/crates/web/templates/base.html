<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{% endblock %}</title>
    <link rel="icon" href="/brand/logo.svg" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;900&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap"
    />
    <link rel="stylesheet" href="/brand/devlanes.css" />
  </head>
  <body style="--dl-lane: var(--dl-lane-{{ info.lane % 4 }})">
    <div class="dl-page">
      <header class="dl-header">
        <a class="dl-brand" href="https://devlanes.run">
          <img src="/brand/logo.svg" alt="" width="32" height="32" />
          devlanes
        </a>
        <nav class="dl-nav">
          <a href="https://github.com/devlanes-run/examples/tree/main/languages-rust-axum">
            languages-rust-axum on GitHub
          </a>
        </nav>
      </header>
      <main class="dl-main">
{% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
