# yaml-language-server: $schema=https://devlanes.run/v1/schema.json
project: example-rust-axum

global_env:
  LANE_LABEL: ${{ lane.label }}
  LANE_DOMAIN: ${{ lane.domain }}

services:
  web:
    # The workspace Cargo.toml: devlanes finds the member that owns the `web` binary and runs
    # `cargo run -p web --bin web`. The file also makes the platform rust, which sets
    # SSL_CERT_FILE to the devlanes CA bundle.
    # Nothing watches crates/, so after an edit `devlanes restart web` rebuilds and starts it.
    run_script:
      file: Cargo.toml
      name: web
    # example-rust-axum.localhost in lane 0, example-rust-axum1.localhost in lane 1.
    hosts: ${{ lane.domain }}
    env:
      # public_url on purpose: the call goes through the proxy over HTTPS, so
      # reqwest has to trust the devlanes CA.
      API_URL: ${{ services.api.public_url }}
    ready:
      http:
        path: /healthz
        # The first start compiles every dependency, and web and api share one
        # target/ directory, so one of them waits for the other's build.
        timeout: 10m

  api:
    run_script:
      file: Cargo.toml
      name: api
    hosts: api.${{ lane.domain }}
    ready:
      http:
        path: /healthz
        timeout: 10m
