# yaml-language-server: $schema=https://devlanes.run/v1/schema.json
project: example-ready-checks

global_env:
  LANE_LABEL: ${{ lane.label }}
  LANE_DOMAIN: ${{ lane.domain }}
  INDEX_URL: ${{ services.index.public_url }}

tasks:
  # A new worktree has no node_modules, so the lane installs them before its first start.
  install:
    run: [npm, install]
    when: lane.create

# Every service runs the same server. MODE picks its behaviour (src/modes/), and
# its ready check is the part to read.
templates:
  node:
    run_script:
      file: package.json
      name: dev

services:
  index:
    extends: node
    hosts: ${{ lane.domain }}
    ready:
      http:
        path: /healthz
    env:
      MODE: index
      HTTP_CHECK_URL: ${{ services.http_check.public_url }}
      TCP_CHECK_URL: ${{ services.tcp_check.public_url }}
      LOG_CHECK_URL: ${{ services.log_check.public_url }}
      OWN_HOST_URL: ${{ services.own_host.public_url }}
      OWN_HOST_CMD_URL: ${{ services.own_host_cmd.public_url }}
      LEGACY_HOST_URL: ${{ services.legacy_host.public_url }}
      SLOW_START_URL: ${{ services.slow_start.public_url }}

  http-check:
    extends: node
    hosts: http-check.${{ lane.domain }}
    env:
      MODE: http
    ready:
      http:
        path: /healthz
      # Short, so a wrong path fails after 15 s instead of the default 60 s.
      timeout: 15s

  tcp-check:
    extends: node
    hosts: tcp-check.${{ lane.domain }}
    env:
      MODE: tcp
    # Passes as soon as the socket is open. Services with hosts get this check
    # when they set no ready at all.
    ready:
      tcp: true

  log-check:
    extends: node
    hosts: log-check.${{ lane.domain }}
    env:
      MODE: log
    # The server prints this line once it listens, after its 3 s warm-up.
    ready:
      log: listening on http://

  own-host:
    extends: node
    hosts: own-host.${{ lane.domain }}
    env:
      MODE: own-host
      ALLOWED_HOST: ${{ self.hosts[0] }}
    # The app refuses any other Host, and the check's default Host is
    # 127.0.0.1:<port>, so send the hostname instead.
    ready:
      http:
        path: /healthz
        host: ${{ self.hosts[0] }}

  own-host-cmd:
    extends: node
    hosts: own-host-cmd.${{ lane.domain }}
    env:
      MODE: own-host
      ALLOWED_HOST: ${{ self.hosts[0] }}
    # The same check written as a command, for when the check needs more than
    # a path and a Host header (another header, a client certificate, a script).
    ready:
      cmd: 'curl -fsS -H "Host: ${{ self.hosts[0] }}" ${{ self.url }}/healthz'

  legacy-host:
    extends: node
    # The app accepts only its own address as Host, so the proxy sends
    # 127.0.0.1:<port> instead of legacy-host.<lane domain>.
    hosts:
      host: legacy-host.${{ lane.domain }}
      host_header: upstream
    env:
      MODE: legacy-host
    # The check already sends Host: 127.0.0.1:<port>, so it needs no host.
    ready:
      http:
        path: /healthz

  slow-start:
    extends: node
    hosts: slow-start.${{ lane.domain }}
    env:
      MODE: slow-start
    # The app sleeps 8 s before it listens, so devlanes start waits for it and
    # devlanes status shows it starting.
    ready:
      http:
        path: /healthz
