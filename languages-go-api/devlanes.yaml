# yaml-language-server: $schema=https://devlanes.run/v1/schema.json
project: example-go-api

global_env:
  LANE_LABEL: ${{ lane.label }}
  LANE_DOMAIN: ${{ lane.domain }}

services:
  web:
    # `task --taskfile Taskfile.yml dev:web`, which runs air: it rebuilds and restarts web on every save.
    run_script:
      file: Taskfile.yml
      name: dev:web
    # No `platform`: the go.mod next to the Taskfile makes it go, which sets SSL_CERT_FILE to
    # the devlanes CA bundle.
    # example-go-api.localhost in lane 0, example-go-api1.localhost in lane 1.
    hosts: ${{ lane.domain }}
    env:
      # The lane's data folder, outside the worktree: air builds the binary there, so lanes
      # sharing this folder never run one binary.
      BUILD_DIR: ${{ lane.data_path }}
      # public_url on purpose: the call goes through the proxy over HTTPS, so Go has to
      # trust the devlanes CA.
      API_URL: ${{ services.api.public_url }}
    ready:
      http:
        path: /healthz
        # The first start downloads and builds air, then builds web.
        timeout: 10m

  api:
    # `go run ./cmd/api` in this folder. The go.mod file also makes the platform go.
    # Nothing watches the files, so after an edit `devlanes restart api` rebuilds and starts it.
    run_script:
      file: go.mod
      name: api
    hosts: api.${{ lane.domain }}
    ready:
      http:
        path: /healthz
        # The first go run compiles the program before it listens.
        timeout: 10m
