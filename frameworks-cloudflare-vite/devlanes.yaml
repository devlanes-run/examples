# yaml-language-server: $schema=https://devlanes.run/v1/schema.json
project: example-cloudflare-vite

global_env:
  LANE_LABEL: ${{ lane.label }}
  LANE_DOMAIN: ${{ lane.domain }}

tasks:
  # A new worktree has no node_modules, so the lane installs them before its first start.
  install:
    run: [npm, install]
    when: lane.create

services:
  web:
    # Adds --port, --strictPort and --host to `vite`, so the port never hops.
    preset: vite
    run_script:
      file: package.json
      name: dev
    hosts:
      - "${{ lane.domain }}"
      # The Worker's DevTools inspector, which the plugin opens on its own port.
      # Miniflare closes inspector WebSockets whose Host is not 127.0.0.1 or
      # localhost, so the proxy sends the local address instead of this name.
      - host: "inspect.${{ lane.domain }}"
        port: inspector
        host_header: upstream
    ready:
      http:
        # Answered by the Worker, so the check waits for workerd as well as Vite.
        path: /healthz
    env:
      # vite.config.ts hands this to the plugin's inspectorPort. Referencing it
      # allocates a second port per lane, which the inspect hostname routes to.
      INSPECTOR_PORT: ${{ self.ports.inspector }}
      VITE_LANE: ${{ lane.index }}
      VITE_INSPECT_URL: https://inspect.${{ lane.domain }}
