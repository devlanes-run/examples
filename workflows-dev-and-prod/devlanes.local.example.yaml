# yaml-language-server: $schema=https://devlanes.run/v1/schema.json

# Copy to devlanes.local.yaml, which Git ignores. It is merged over
# devlanes.yaml, so it also reaches example-dev-and-prod-release, whose
# devlanes.prod.yaml extends devlanes.yaml. A worktree without its own copy
# uses the primary worktree's.
services:
  web:
    # The default profile selects services with "*", which skips this one.
    autostart: false
  api:
    env:
      # Added to api's env; the variables from devlanes.yaml stay.
      LOG_LEVEL: debug
  # A service only this machine runs.
  scratch:
    run_script:
      file: apps/scratch/package.json
      name: dev
    hosts: "scratch.${{ lane.domain }}"
    ready:
      http:
        path: /healthz
    env:
      API_URL: ${{ services.api.url }}
