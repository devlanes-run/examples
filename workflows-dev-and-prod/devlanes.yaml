# yaml-language-server: $schema=https://devlanes.run/v1/schema.json
project: example-dev-and-prod

global_env:
  LANE_LABEL: ${{ lane.label }}
  LANE_DOMAIN: ${{ lane.domain }}
  # Shown on the pages; devlanes.prod.yaml sets its own.
  PROJECT_FILE: devlanes.yaml
  # vite build writes here and vite preview serves from here. The lane data
  # folder belongs to one lane of one project, so the prod profile, a second
  # lane and the example-dev-and-prod-release project never share a bundle.
  WEB_OUT_DIR: ${{ lane.data_path }}/web-dist

tasks:
  # One npm install at the workspace root installs every app in a new worktree.
  install:
    # --include=dev because profile env reaches tasks too, and npm leaves out
    # devDependencies such as vite and tsc when NODE_ENV is production.
    run: [npm, install, --include=dev]
    when: lane.create
  build:
    # tsc for api and scratch, tsc and vite build for web.
    run_script:
      file: package.json
      name: build
    when: lane.start
    # Only `devlanes start --profile prod` builds; the dev servers need no build.
    profiles: [prod]

services:
  api:
    run_script:
      file: apps/api/package.json
      name: dev
    hosts: "api.${{ lane.domain }}"
    ready:
      http:
        path: /healthz

  web:
    # Adds --port, --strictPort and --host to `vite` and to `vite preview`.
    preset: vite
    run_script:
      file: apps/web/package.json
      name: dev
    hosts: "${{ lane.domain }}"
    ready:
      http:
        path: /healthz
    env:
      # The page reads it from /mode and calls the api from the browser.
      API_PUBLIC_URL: ${{ services.api.public_url }}

profiles:
  # Globs skip services with `autostart: false`, so devlanes.local.yaml can turn
  # one off without editing this list.
  default:
    include: ["*"]
    env:
      NODE_ENV: development
      APP_PROFILE: default
  # The same services in the same lane, run from the built code.
  prod:
    include: ["*"]
    # Services whose run_script names dev run start from the same package.json:
    # `node dist/index.js` for api, `vite preview` for web.
    run_scripts:
      dev: start
    env:
      NODE_ENV: production
      APP_PROFILE: prod
