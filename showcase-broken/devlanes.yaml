# yaml-language-server: $schema=https://devlanes.run/v1/schema.json
project: broken

global_env:
  LANE_LABEL: ${{ lane.label }}
  LANE_DOMAIN: ${{ lane.domain }}

profiles:
  # A plain `devlanes start` runs only the healthy index; each broken service starts by name.
  default: [index]

templates:
  broken:
    run: [node, server.mjs]
    tags: [broken]

services:
  index:
    run: [node, server.mjs]
    env:
      MODE: index
    hosts: ${{ lane.domain }}
    ready:
      http:
        path: /healthz

  # Exits 1 before it listens: the start fails and the unit stays failed.
  crash:
    extends: broken
    env:
      MODE: crash
    hosts: crash.${{ lane.domain }}

  # Healthy until a request to /crash, /reset or /upgrade.
  fragile:
    extends: broken
    env:
      MODE: fragile
    hosts: fragile.${{ lane.domain }}
    ready:
      http:
        path: /healthz

  # A list is run without a shell, so devlanes itself reports the missing program.
  missing:
    extends: broken
    run: [acme-dev-server, "--port=${{ self.port }}"]
    hosts: missing.${{ lane.domain }}

  # `started` counts it ready without probing the port it was given.
  wrongport:
    extends: broken
    env:
      MODE: wrongport
    hosts: wrongport.${{ lane.domain }}
    ready: started

  # The timeout is above the proxy's 30 second wait, so requests see DL202 before DL203.
  neverready:
    extends: broken
    env:
      MODE: neverready
    hosts: neverready.${{ lane.domain }}
    ready:
      http:
        path: /healthz
      timeout: 45s

  # Forwards to its own public URL with the original Host header.
  loop:
    extends: broken
    env:
      MODE: loop
      PUBLIC_URL: ${{ self.public_url }}
    hosts: loop.${{ lane.domain }}
    ready:
      http:
        path: /healthz
