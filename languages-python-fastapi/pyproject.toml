[project]
name = "python-fastapi"
version = "0.1.0"
description = "FastAPI under uv in a devlanes lane"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "uvicorn==0.54.0",
]

# devlanes runs this entry point with `uv run quotes` (run_script on pyproject.toml).
[project.scripts]
quotes = "acme.quotes:main"

[build-system]
requires = ["uv_build==0.11.26"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "acme"
module-root = ""
