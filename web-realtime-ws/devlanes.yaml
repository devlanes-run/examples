# yaml-language-server: $schema=https://devlanes.run/v1/schema.json
project: example-realtime-ws

global_env:
  LANE_LABEL: ${{ lane.label }}
  LANE_DOMAIN: ${{ lane.domain }}

tasks:
  # A new worktree has no node_modules, so the lane installs them before its first start.
  install:
    run: [npm, install]
    when: lane.create

services:
  realtime:
    # npm comes from packageManager in package.json, so devlanes runs `npm run dev`.
    run_script:
      file: package.json
      name: dev
    env:
      # Mentioning self.ports.<name> gives the service one more port per name, stable per lane.
      WS_PORT: ${{ self.ports.ws }}
      ADMIN_PORT: ${{ self.ports.admin }}
    hosts:
      # The main port serves the page, SSE on /events and a WebSocket on /ws.
      # The proxy needs no setting for either.
      - ${{ lane.domain }}
      - host: ws.${{ lane.domain }}
        port: ws
      - host: admin.${{ lane.domain }}
        port: admin
    # The server opens the main port last, so this check passes once all three ports listen.
    ready:
      http:
        path: /healthz
