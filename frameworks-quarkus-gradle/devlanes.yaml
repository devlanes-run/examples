# yaml-language-server: $schema=https://devlanes.run/v1/schema.json
project: example-quarkus-gradle

infra:
  compose: docker-compose.yml
  project_name: example-quarkus-gradle
  # Each lane gets its own Postgres container, port and pgdata volume, in the Compose
  # project example-quarkus-gradle-lane<N>.
  per_lane: [postgres]
  setup:
    # Plain `docker compose` would target the shared project, where Postgres does not run.
    schema: docker compose -p "$DEVLANES_COMPOSE_LANE_PROJECT" exec -T postgres psql -U postgres -d notes -v ON_ERROR_STOP=1 < infra/schema.sql

global_env:
  LANE_LABEL: ${{ lane.label }}
  LANE_DOMAIN: ${{ lane.domain }}

services:
  web:
    # The gradle runner: ./gradlew quarkusDev in this folder.
    run_script:
      file: build.gradle.kts
      name: quarkusDev
    # QUARKUS_HTTP_PORT and QUARKUS_HTTP_HOST, plus a debug port of the lane's own passed as
    # -Ddebug, so two lanes do not both ask for 5005.
    preset: quarkus
    hosts: "${{ lane.domain }}"
    env:
      # Quarkus reads these itself; Dev Services is off in application.properties.
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://127.0.0.1:${{ infra.postgres.port }}/notes
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      # The same port the preset passes to quarkusDev, for the page to show.
      DEBUG_PORT: ${{ self.ports.debug }}
      # Services do not get DEVLANES_COMPOSE_LANE_PROJECT, so the page builds the container
      # name Compose gives the lane's Postgres.
      POSTGRES_CONTAINER: ${{ project.name }}-lane${{ lane.index }}-postgres-1
    ready:
      http:
        path: /healthz
        # The first start downloads Gradle, the Quarkus plugin and every dependency.
        timeout: 5m
