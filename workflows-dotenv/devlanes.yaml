# yaml-language-server: $schema=https://devlanes.run/v1/schema.json
project: example-dotenv

global_env:
  LANE_LABEL: ${{ lane.label }}
  LANE_DOMAIN: ${{ lane.domain }}
  # The one value the apps need per lane. packages/config derives the web, api
  # and asset URLs and the cookie domain from it, so .env holds no URLs at all.
  APP_DOMAIN: ${{ lane.domain }}
  # .env is gitignored, so a new worktree has none. devlanes' own ${{ env.X }}
  # already falls back to the primary worktree's .env; these two paths let the
  # web app find the same file when it lists its keys.
  DOTENV_ROOT: ${{ project.primary_path }}
  LANE_PATH: ${{ lane.path }}
  # devlanes never injects .env into processes. Each key a process needs is
  # named here; a key missing from both .env and the shell fails the start.
  ACME_API_TOKEN: ${{ env.ACME_API_TOKEN }}
  FEATURE_FLAGS: ${{ env.FEATURE_FLAGS | default('') }}
  # Optional: empty or missing turns Sentry off instead of failing the start.
  SENTRY_DSN: ${{ env.SENTRY_DSN | default('') }}

tasks:
  # A new worktree has no node_modules; one install at the root covers every app.
  install:
    run: [npm, install]
    when: lane.create

services:
  web:
    run_script:
      file: apps/web/package.json
      name: dev
    # The page loads its CSS and logo from assets.<domain>, another URL derived
    # from APP_DOMAIN.
    hosts:
      - ${{ lane.domain }}
      - assets.${{ lane.domain }}
    ready:
      http:
        path: /healthz
  api:
    run_script:
      file: apps/api/package.json
      name: dev
    hosts: api.${{ lane.domain }}
    ready:
      http:
        path: /healthz
