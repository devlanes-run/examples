# yaml-language-server: $schema=https://devlanes.run/v1/schema.json
project: example-profiles-tags

global_env:
  LANE_LABEL: ${{ lane.label }}
  LANE_DOMAIN: ${{ lane.domain }}

tasks:
  # A new worktree has no node_modules, so the lane installs them before its first start.
  # One install at the root covers every workspace.
  install:
    run: [npm, install]
    when: lane.create

# A service takes the colour of the first of its tags that has one, so every
# service lists its category tag (api, web, worker, docs) first and its
# selection tags after it.
tags:
  api: { color: cyan, description: HTTP APIs the web apps call }
  web: { color: green, description: Pages people open in a browser }
  worker: { color: magenta, description: Background processes without a port }
  docs: { color: yellow, description: Documentation sites nobody needs on every start }
  essential: { color: white, description: The smallest set that lets you use the shop }
  auth: { color: blue, description: Sign-in and user accounts }
  payments: { color: red, description: Invoices and payment providers }
  catalog: { color: bright-cyan, description: Products and prices }
  shop: { color: bright-green, description: The customer-facing storefront }
  admin: { color: bright-blue, description: Back-office tools for staff }
  email: { color: bright-magenta, description: Outgoing mail }

templates:
  # Every app has a dev script; each service only names its package.json.
  node:
    run_script:
      name: dev
  server:
    extends: node
    ready:
      http:
        path: /healthz
  api:
    extends: server
    env:
      # Records live in a JSON file in the lane's data folder; the test profile
      # points this at another file.
      DATA_FILE: ${{ lane.data_path }}/${{ self.name }}.json
  web:
    extends: server
    env:
      # url for the page's server-side fetch, public_url for the link it shows.
      ACCOUNTS_API_URL: ${{ services.accounts_api.url }}
      ACCOUNTS_API_PUBLIC_URL: ${{ services.accounts_api.public_url }}
      BILLING_API_URL: ${{ services.billing_api.url }}
      BILLING_API_PUBLIC_URL: ${{ services.billing_api.public_url }}
      CATALOG_API_URL: ${{ services.catalog_api.url }}
      CATALOG_API_PUBLIC_URL: ${{ services.catalog_api.public_url }}
  worker:
    extends: node
    # No port to probe, so the start waits for this line.
    ready:
      log: "worker ready:"
    # Workers do their job without inbound requests; a frozen lane would
    # suspend the mailer along with everything else.
    keep_awake: true
    env:
      DATA_FILE: ${{ lane.data_path }}/${{ self.name }}.json

services:
  accounts-api:
    extends: api
    run_script: { file: apps/accounts-api/package.json }
    tags: [api, essential, auth]
    hosts: "accounts.${{ lane.domain }}"
  billing-api:
    extends: api
    run_script: { file: apps/billing-api/package.json }
    tags: [api, payments]
    hosts: "billing.${{ lane.domain }}"
  catalog-api:
    extends: api
    run_script: { file: apps/catalog-api/package.json }
    tags: [api, essential, catalog]
    hosts: "catalog.${{ lane.domain }}"
  shop-web:
    extends: web
    run_script: { file: apps/shop-web/package.json }
    tags: [web, essential, shop]
    hosts: "${{ lane.domain }}"
  admin-web:
    extends: web
    run_script: { file: apps/admin-web/package.json }
    tags: [web, admin]
    hosts: "admin.${{ lane.domain }}"
  mailer:
    extends: worker
    run_script: { file: apps/mailer/package.json }
    tags: [worker, essential, email]
    env:
      ACCOUNTS_API_URL: ${{ services.accounts_api.url }}
  docs:
    extends: server
    run_script: { file: apps/docs/package.json }
    # Shown in the TUI and in status instead of the key; commands still say docs.
    name: Component docs
    tags: [docs]
    hosts: "docs.${{ lane.domain }}"
    # Only `devlanes start docs` (or +docs) starts it; globs such as * skip it.
    autostart: false

profiles:
  # The first plain `devlanes start`, and the next one after `devlanes stop`.
  default: [+essential]
  backend: [+api, +worker]
  web: [+web]
  # Everything with a page or an API. The glob skips docs (autostart: false).
  all:
    include: ["*"]
    exclude: [+worker]
  test:
    include: [+essential]
    # Same lane, other files: the dev records are still there after the run.
    env:
      DATA_FILE: ${{ lane.data_path }}/test/${{ self.name }}.json
  attach:
    include: [+web]
    # Nothing to skip in this example; in a repository with containers this
    # keeps the lane from starting its own databases.
    infra: false
    env:
      ACCOUNTS_API_URL: ${{ lanes.main.services.accounts_api.url }}
      ACCOUNTS_API_PUBLIC_URL: ${{ lanes.main.services.accounts_api.public_url }}
      BILLING_API_URL: ${{ lanes.main.services.billing_api.url }}
      BILLING_API_PUBLIC_URL: ${{ lanes.main.services.billing_api.public_url }}
      CATALOG_API_URL: ${{ lanes.main.services.catalog_api.url }}
      CATALOG_API_PUBLIC_URL: ${{ lanes.main.services.catalog_api.public_url }}
